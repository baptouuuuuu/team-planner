<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Planner</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <!-- All visible texts are injected by app.js from the LABELS object -->
  <header><h1 id="app-title"></h1>
    <div class="toolbar">
      <button id="btn-lock" type="button"></button>
      <button id="btn-history-clear" type="button"></button>
      <button id="btn-export" type="button"></button>
      <button id="btn-import" type="button"></button>
      <button id="btn-reset" type="button"></button>
      <input id="file-import" type="file" accept="application/json" hidden>
    </div>
  </header>
  <main>
    <section id="settings-section" class="panel"></section>
    <div class="side">
      <section id="tasks-section" class="panel"></section>
      <section id="people-section" class="panel"></section>
    </div>
    <section id="byperson-section" class="panel wide"></section>
    <details id="timeline-details" class="panel wide fold"><summary id="timeline-summary"></summary><section id="timeline-section"></section></details>
    <details id="history-details" class="panel wide fold"><summary id="history-summary"></summary><section id="history-section"></section></details>
  </main>
  <div id="popup-overlay" class="overlay" hidden></div>
  <script src="app.js?v=10"></script>
</body>
</html>
